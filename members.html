<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会员信息 - 千缘婚恋服务中心</title>
<meta name="description" content="浏览已通过审核的男女会员资料：年龄、身高、学历、职业、现居地等，联系方式脱敏展示，需工作人员协助联系。" />
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/700.css" />
</head>
<body>
<a class="skip-link" href="#main">跳转到主要内容</a>

<div id="site-topbar"></div>
<div id="site-header"></div>

<div class="crumb"><div class="wrap">
  <a href="index.html">首页</a> &gt; <span id="crumb-current">会员信息</span>
</div></div>

<div class="page-head"><div class="wrap">
  <h1 id="page-title">会员信息</h1>
  <p>以下为已通过资料审核的会员，联系方式已做脱敏处理。如希望进一步了解，请致电服务窗口，由工作人员在双方同意后协助联系。</p>
</div></div>

<main id="main" class="wrap" style="margin-top:20px">

  <!-- 筛选条件 -->
  <section class="filter-bar" aria-label="筛选条件">
    <div class="filter-row">
      <span class="fl-label">性别</span>
      <button type="button" class="chip" data-g="all">全部</button>
      <button type="button" class="chip" data-g="male">男嘉宾</button>
      <button type="button" class="chip" data-g="female">女嘉宾</button>
    </div>
    <div class="filter-row">
      <span class="fl-label">年龄段</span>
      <button type="button" class="chip" data-age="all">不限</button>
      <button type="button" class="chip" data-age="18-25">25岁及以下</button>
      <button type="button" class="chip" data-age="26-30">26-30岁</button>
      <button type="button" class="chip" data-age="31-35">31-35岁</button>
      <button type="button" class="chip" data-age="36-40">36-40岁</button>
      <button type="button" class="chip" data-age="41-99">41岁及以上</button>
    </div>
    <div class="filter-row">
      <span class="fl-label">学历</span>
      <select class="filter-select" id="f-edu">
        <option value="">不限</option>
        <option value="大专">大专</option>
        <option value="本科">本科</option>
        <option value="硕士">硕士</option>
        <option value="博士">博士</option>
      </select>
      <span class="fl-label" style="margin-left:10px">关键词</span>
      <input class="filter-input" id="f-kw" type="text" placeholder="编号 / 职业 / 城市" />
      <button type="button" class="btn btn-sm" id="f-apply">查询</button>
      <button type="button" class="btn btn-ghost btn-sm" id="f-reset">重置</button>
    </div>
  </section>

  <div class="result-bar">
    <span id="result-count">资料加载中…</span>
    <span>提示：点击卡片可查看完整资料（联系方式仍为脱敏状态）</span>
  </div>

  <div id="member-list">
    <div class="loading"><div class="spinner"></div>会员资料加载中…</div>
  </div>

  <div class="pager" id="pager"></div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/members.js"></script>
</body>
</html>
